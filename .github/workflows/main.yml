name: Build
 
on:
  push:
  workflow_dispatch:
 
permissions:
  contents: write
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
 
      - name: Build with Maven
        run: mvn -B package
 
      - name: Check jar exists
        run: ls -l target/SpearDash.jar
 
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: SpearDash
          path: target/SpearDash.jar
          if-no-files-found: error
 
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" target/SpearDash.jar \
            --title "SpearDash build ${{ github.run_number }}" \
            --notes "Latest SpearDash.jar"
